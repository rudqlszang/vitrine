name: vitrine
description: "명품 부티크의 쇼윈도. 보기만 하고 사지 않는 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^3.4.3

  # 로컬 저장
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 네트워크
  dio: ^5.11.1

  # 라우팅
  go_router: ^18.0.1

  # 환경변수 (.env)
  flutter_dotenv: ^6.0.1

  # 숫자/통화 포맷
  intl: ^0.20.3
  uuid: ^4.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.2

flutter:
  uses-material-design: true

  assets:
    # 하위 폴더는 자동 포함되지 않는다. 디렉터리마다 따로 선언해야 한다.
    - assets/
    - assets/brand/
    - .env

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
